<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/assets/icons/favicon.png" />
  <link rel="apple-touch-icon" href="/assets/icons/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="%VITE_OG_DESCRIPTION%" />
  <meta name="theme-color" content="#0A0A0A" />
  <title>%VITE_OG_TITLE%</title>

  <!-- Open Graph / WhatsApp / Facebook / Instagram -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="%VITE_EVENT_MAIN_TITLE%" />
  <meta property="og:url" content="%VITE_SITE_URL%/" />
  <meta property="og:title" content="%VITE_OG_TITLE%" />
  <meta property="og:description" content="%VITE_OG_DESCRIPTION%" />
  <meta property="og:image" content="%VITE_SITE_URL%%VITE_OG_IMAGE%" />
  <meta property="og:image:secure_url" content="%VITE_SITE_URL%%VITE_OG_IMAGE%" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="600" />
  <meta property="og:image:height" content="600" />
  <meta property="og:image:alt" content="%VITE_OG_TITLE%" />

  <!-- Fallback para crawlers y bots que buscan link image_src -->
  <link rel="image_src" href="%VITE_SITE_URL%%VITE_OG_IMAGE%" />

  <!-- Twitter / X Cards -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="%VITE_OG_TITLE%" />
  <meta name="twitter:description" content="%VITE_OG_DESCRIPTION%" />
  <meta name="twitter:image" content="%VITE_SITE_URL%%VITE_OG_IMAGE%" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800&family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap"
    rel="stylesheet">
</head>

<body class="bg-[#0A0A0A] text-white antialiased selection:bg-white selection:text-black">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
