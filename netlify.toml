[build]
  command = "cd client && npm install && npm run build && cd ../server && npm install"
  publish = "client/dist"
  functions = "server/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "server/functions"
  node_bundler = "esbuild"
  included_files = ["server/src/**"]

# Redirigir llamadas al endpoint API backend hacia la función serverless de Netlify
# force = true es obligatorio para evitar que el redirect '/*' a index.html intercepte las peticiones POST a la API
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Redirigir todas las demás rutas al SPA index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
